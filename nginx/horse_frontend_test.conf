# Horse 测试站点 Nginx 配置（内网 IP 测试，与正式发布隔离）
# 部署：复制到 /etc/nginx/sites-available/horse-test，软链到 sites-enabled，nginx -t && systemctl reload nginx
#
# 访问方式：内网 http://<内网IP>:8080 或 http://10.8.52.122:8080
# 与生产区别：不同端口(8080)、不同静态目录(www-test)、不依赖域名 horse.amyclaw.com
#
# 端口关系（与生产一致，共用 horse-server / sign-device）：
#   2026 = horse-server，3012 = amyclaw-nginx→gateway，3020 = sign-device

server {
    listen 8080;
    # 接受任意 Host，方便用内网 IP 直接访问
    server_name _;

    # 测试站静态目录：与生产 www 隔离，发布用 bash scripts/publish-horse-web-test.sh
    root /mnt/disk/amyclaw/data/jim/horse/www-test;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:2026/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /horse-ws {
        proxy_pass http://127.0.0.1:2026/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws-simple {
        proxy_pass http://127.0.0.1:2026/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
