# Horse 内网服务器 Nginx 配置
# 部署到内网服务器（10.8.52.122）的 /etc/nginx/sites-available/horse-frontend
# 
# 使用方法：
# 1. 将此文件复制到内网服务器的 /etc/nginx/sites-available/horse-frontend
# 2. 创建软链接：sudo ln -s /etc/nginx/sites-available/horse-frontend /etc/nginx/sites-enabled/horse-frontend
# 3. 测试配置：sudo nginx -t
# 4. 重载 Nginx：sudo systemctl reload nginx

server {
    listen 80;
    server_name horse.amyclaw.com;

    # 静态 H5 前端目录（根据实际部署路径）
    root /mnt/disk/amyclaw/data/jim/horse/www;
    index index.html;

    # 单页应用入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 代理：将 /ws 代理到 Horse Agent WebSocket 服务
    # Horse Agent 监听 2026 端口
    location /ws {
        proxy_pass http://127.0.0.1:2026/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

