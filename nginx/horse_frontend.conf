# Horse 内网服务器 Nginx 配置（122）
# 部署：复制到 /etc/nginx/sites-available/horse，软链到 sites-enabled，nginx -t && systemctl reload nginx
#
# 端口关系（必读）：
#   2026 = horse-agent（简单协议，不发 connect.challenge，/ws 指此则「能连」）
#   3012 = amyclaw-nginx → gateway:3202（发 connect.challenge，需 device 签名）
#   3020 = sign-device（主网关 identity 签名，/api/ 必须指此，不能指 3001）
#   3001 = horse-agent 的 sign-device（身份与主网关不同，/api/ 指此会 device signature invalid）
#
# 方案 A：走 horse-agent（能连、简单协议）— 下面 /ws 已指向 2026，无需 /api/
# 方案 B：走网关 — 把 /ws 改为 proxy_pass http://127.0.0.1:3012/，并保留下面 location /api/ -> 3020

server {
    listen 80;
    server_name horse.amyclaw.com;

    # 静态目录：必须是 122 宿主机上的路径。容器内代码需发布到此目录（如 bash scripts/publish-horse-web.sh）
    root /mnt/disk/amyclaw/data/jim/horse/www;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 仅当 /ws 指向 3012（网关）时才需要；必须指向 3020，不能指向 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket：2026=horse-agent（能连），3012=网关（需 device 签名）
    location /ws {
        proxy_pass http://127.0.0.1:2026/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 强制简单连接：?proto=simple 时前端连 /horse-ws，固定走 2026，不发 connect.challenge
    # 注意：不要用 /ws-simple，否则若只有 location /ws 时会被前缀匹配到网关（3012）
    location /horse-ws {
        proxy_pass http://127.0.0.1:2026/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 兼容旧前端：/ws-simple 也指 2026（与 /horse-ws 二选一即可）
    location /ws-simple {
        proxy_pass http://127.0.0.1:2026/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

