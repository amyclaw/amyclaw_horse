# Horse 外部 Nginx 代理服务器配置
# 目标内网服务器：10.8.52.122:80
# 域名：horse.amyclaw.com
# 
# 使用方法：
# 1. 将此文件复制到外部代理服务器的 /etc/nginx/sites-available/horse-proxy
# 2. 创建软链接：sudo ln -s /etc/nginx/sites-available/horse-proxy /etc/nginx/sites-enabled/horse-proxy
# 3. 测试配置：sudo nginx -t
# 4. 重载 Nginx：sudo systemctl reload nginx

# HTTP 配置（80 端口）
server {
    listen 80;
    server_name horse.amyclaw.com;

    # 反向代理到内网服务器
    location / {
        proxy_pass http://10.8.52.122:80;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（重要！必须配置）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置（WebSocket 长连接需要）
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
    }
}

