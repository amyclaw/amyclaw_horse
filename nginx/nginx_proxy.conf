server {
    listen 80;
    server_name amy.amyclaw.com;

    location / {
        # 转发到新的网关端口 3202（容器内部端口），避免与其它环境使用的 3000-3100 端口冲突
        proxy_pass http://amyclaw-gateway:3202;

        # [OK] WebSocket Support (Keep this)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # [FIXED] Dynamic Protocol (Don't lie about HTTPS)
        # Use $scheme so it works over HTTP or HTTPS automatically
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # [FIXED] Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # [REMOVED] The 'Origin' header. Let the browser send the real one.

        # [OK] Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
    }
}

